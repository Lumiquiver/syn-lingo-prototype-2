<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynLingo | AI Sign Language</title>

    <!-- Google Fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Plus+Jakarta+Sans', -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .top-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .streak {
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #container {
            width: 90vw;
            max-width: 720px;
            padding: 24px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Changed to cover for a more immersive feel */
        }

        canvas { pointer-events: none; z-index: 2; }

        .controls {
            margin-top: 24px;
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active { transform: scale(0.98); }

        #status-msg {
            margin-top: 20px;
            font-size: 0.95rem;
            color: var(--text-dim);
            min-height: 1.2em;
        }

        .live-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            z-index: 3;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .prediction-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 3;
            display: none;
            white-space: nowrap;
        }

        footer {
            margin-top: 40px;
            padding: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.6;
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>

<body>

<div class="top-bar">
    <h1>SynLingo <span style="font-weight: 300; font-size: 0.8rem; color: var(--primary);">PROTOTYPE</span></h1>
    <div class="streak">🔥 14 Days</div>
</div>

<div id="container">
    <div class="video-wrapper">
        <div class="live-tag" id="liveTag">● Live</div>
        <div class="prediction-overlay" id="predBox">---</div>
        <video id="v" autoplay playsinline></video>
        <canvas id="c"></canvas>
    </div>

    <div class="controls">
        <button id="startBtn">
            <span class="loader" id="loader"></span>
            Start Learning Session
        </button>
        <div id="status-msg">Click start to initialize camera and AI modules.</div>
    </div>
</div>

<footer>
    <strong>Developed By:</strong> Vishwajith, Drishti, Saumya, Manya<br>
    Class 11 AI Project • 2026 Edition
</footer>

<script>
    const btn = document.getElementById('startBtn');
    const video = document.getElementById('v');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('status-msg');
    const liveTag = document.getElementById('liveTag');
    const predBox = document.getElementById('predBox');
    const loader = document.getElementById('loader');

    // Offscreen canvas for Roboflow snapshots
    const offscreenCanvas = document.createElement('canvas');
    const offCtx = offscreenCanvas.getContext('2d');

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
        // Match canvas size to video display size
        canvas.width = video.clientWidth;
        canvas.height = video.clientHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks) {
            for (const landmarks of results.multiHandLandmarks) {
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#6366f1', lineWidth: 4});
                drawLandmarks(ctx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 4});
            }
        }
    });

    btn.onclick = async () => {
        loader.style.display = 'inline-block';
        btn.disabled = true;
        statusMsg.innerText = "Initializing AI Models...";

        try {
            const camera = new Camera(video, {
                onFrame: async () => {
                    await hands.send({image: video});
                },
                width: 1280,
                height: 720
            });

            await camera.start();
            
            video.onloadeddata = () => {
                loader.style.display = 'none';
                btn.style.display = 'none';
                liveTag.style.display = 'block';
                predBox.style.display = 'block';
                statusMsg.innerText = "System Active: Show a sign to the camera.";
                setInterval(detectSign, 800); // Slightly faster interval
            };
        } catch (err) {
            statusMsg.innerText = "Error: Camera access denied.";
            console.error(err);
        }
    };

    async function detectSign() {
        if (!video.videoWidth) return;

        // Draw current frame to offscreen canvas
        offscreenCanvas.width = 416; // Optimized size for Roboflow
        offscreenCanvas.height = 416;
        offCtx.drawImage(video, 0, 0, 416, 416);

        const base64 = offscreenCanvas.toDataURL("image/jpeg", 0.7).split(",")[1];

        try {
            const response = await axios.post(
                "https://detect.roboflow.com/indian-sign-language-detection/1?api_key=XTafEtrfaIn5WlTgQiAY",
                base64,
                { headers: { "Content-Type": "application/x-www-form-urlencoded" } }
            );

            const predictions = response.data.predictions;

            if (predictions && predictions.length > 0) {
                // Get prediction with highest confidence
                const topPred = predictions.sort((a, b) => b.confidence - a.confidence)[0];
                const signName = topPred.class.toUpperCase();
                
                predBox.innerText = signName;
                predBox.style.borderColor = "var(--primary)";
                statusMsg.innerText = `Detected: ${signName} (${Math.round(topPred.confidence * 100)}%)`;
            } else {
                predBox.innerText = "---";
                predBox.style.borderColor = "rgba(255,255,255,0.2)";
                statusMsg.innerText = "Watching for signs...";
            }
        } catch (err) {
            console.error("API Error:", err);
        }
    }
</script>

</body>
</html>
